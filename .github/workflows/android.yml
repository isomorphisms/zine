name: First poem APK
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Stable public test signer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphismes/wegert
          ref: 89dcfb840cec1a66ee04c7f7404954cbd6c09839
          path: .test-signing
          sparse-checkout: _/build/app/wegert-debug.keystore
          sparse-checkout-cone-mode: false
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'
      - name: Build MIRO A1 APK
        run: make -f android/Makefile ABI=armeabi-v7a verify
      - name: Build emulator APK
        run: make -f android/Makefile ABI=x86_64 verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zine-apks-${{ github.event.pull_request.head.sha || github.sha }}
          path: android/build/zine-*.apk*
          if-no-files-found: error
      # This action owns the emulator shell interface; commands below are only
      # its install/launch acceptance boundary, not a consumer shell program.
      - name: Install twice and display the poem after restart
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r android/build/zine-x86_64.apk
            adb install -r android/build/zine-x86_64.apk
            adb shell am start -W -n org.walnutburgundy.zine/android.app.NativeActivity
            adb shell uiautomator dump /sdcard/zine.xml
            adb pull /sdcard/zine.xml android/build/first-launch.xml
            grep -F 'Nothing Gold Can Stay' android/build/first-launch.xml
            grep -F 'Nothing gold can stay.' android/build/first-launch.xml
            adb shell am force-stop org.walnutburgundy.zine
            adb shell am start -W -n org.walnutburgundy.zine/android.app.NativeActivity
            adb shell uiautomator dump /sdcard/zine.xml
            adb pull /sdcard/zine.xml android/build/restarted.xml
            grep -F 'Nothing Gold Can Stay' android/build/restarted.xml
            adb shell screencap -p /sdcard/zine.png
            adb pull /sdcard/zine.png android/build/first-poem.png
      - name: Retain emulator evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zine-emulator-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            android/build/*.xml
            android/build/*.png
          if-no-files-found: error
